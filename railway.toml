[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"

# ── Non-sensitive defaults (override in Railway dashboard if needed) ──
[variables]
OPENROUTER_MODEL = "qwen/qwen3-vl-30b-a3b-thinking"
FRONTEND_URL = "https://aiquran.live"
DATABASE_URL = "sqlite:///./quranai.db"
DATA_DIR = "./quran_data"
JWT_EXPIRY_HOURS = "72"
EMBEDDING_MODEL = "sentence-transformers/all-MiniLM-L6-v2"

# ── Set values for these in Railway dashboard → Variables ──────────────
OPENROUTER_API_KEY = ""
GOOGLE_CLIENT_ID = ""
JWT_SECRET = ""
